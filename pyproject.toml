[project]
name = "python-async-template"
version = "0.1.0"
description = "Async Python service template (FastAPI, SQLAlchemy, Redis, Celery)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.0",
  "asyncpg>=0.30.0",
  "celery[redis]>=5.5.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "redis[hiredis]>=5.3.0",
  "sentry-sdk[fastapi]>=2.20.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pre-commit>=4.5.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["app"]
python_files = ["*_tests.py"]
asyncio_mode = "auto"

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "alembic/versions",
]
line-length = 100
indent-width = 4
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "W",
  "B",
  "C4",
  "UP",
  "N",
  "S",
  "T20",
  "I",
  "TID",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = ["B904", "Q000", "Q001", "Q002", "Q003", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-sort-within-sections = true
lines-after-imports = 2
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"*_tests.py" = ["S101", "TID252"]
"alembic/versions/*.py" = ["T20"]
"app/core/config.py" = ["S105"]
"app/tasks/asyncio_runner.py" = ["UP047"]
