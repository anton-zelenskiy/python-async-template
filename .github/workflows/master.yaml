name: CI/CD

on:
  push:
    branches: ['master']

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install deps
        run: uv sync --frozen --dev
      - name: Run tests
        run: uv run pytest -q

  build_and_push:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - name: Check deploy secrets present
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [ -n "$SSH_HOST" ] || { echo "Missing secret: SSH_HOST"; exit 1; }
          [ -n "$SSH_USER" ] || { echo "Missing secret: SSH_USER"; exit 1; }
          [ -n "$SSH_KEY" ]  || { echo "Missing secret: SSH_KEY"; exit 1; }
          [ -n "$DEPLOY_PATH" ] || { echo "Missing secret: DEPLOY_PATH"; exit 1; }
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            export GHCR_IMAGE="ghcr.io/${{ github.repository }}:latest"
            docker compose pull
            docker compose run --rm web alembic upgrade head
            docker compose up -d
